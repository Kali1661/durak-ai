<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Apply the saved theme before first paint; follow the system when none is saved.
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
    <title>Durak AI - play Durak or get move suggestions</title>
    <meta name="description" content="Play the card game Durak against computer opponents, or enter a real game and get search-based move suggestions. For two or three players." />
  </head>
  <body>
    <div id="app"></div>
    <noscript>Durak AI needs JavaScript and WebAssembly to run.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
