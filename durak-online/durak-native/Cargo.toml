[package]
name = "durak-native"
version = "0.1.0"
edition = "2024"
description = "Durak AI with the engine running natively: serves the web app and answers its searches"

[[bin]]
name = "durak-ai"
path = "src/main.rs"

[dependencies]
durak-core = { path = "../durak-core" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.116"
tiny_http = "0.12"
